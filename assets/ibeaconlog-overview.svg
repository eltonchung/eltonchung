<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
<title>iBeaconLog：功能示意圖</title>
<desc>依公開專案文件繪製的概念圖，非實際操作介面。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1426"/><stop offset="1" stop-color="#14273a"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#1e344e"/><stop offset="1" stop-color="#16213b"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6b9ab8"/></marker></defs>
<rect width="1280" height="720" rx="28" fill="url(#bg)"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif">
<text x="56" y="78" font-size="46" fill="#eaf0ff" font-weight="700" text-anchor="start">iBeaconLog</text>
<text x="56" y="119" font-size="23" fill="#a9bdd4" font-weight="400" text-anchor="start">讓指定場域的進出事件，成為留在 iPhone 上的紀錄</text>
<rect x="1064" y="46" width="160" height="38" rx="19" fill="#1f334a" stroke="#3c5876"/>
<text x="1144" y="72" font-size="20" fill="#b7d7ed" font-weight="600" text-anchor="middle">功能示意</text>
<rect x="56" y="180" width="320" height="396" rx="24" fill="url(#card)" stroke="#355c82"/>
<text x="84" y="230" font-size="25" fill="#eaf0ff" font-weight="600" text-anchor="start">01  感知範圍變化</text>
<circle cx="216" cy="363" r="92" fill="none" stroke="#6dc8fa" stroke-width="3" opacity="0.2"/>
<circle cx="216" cy="363" r="64" fill="none" stroke="#6dc8fa" stroke-width="3" opacity="0.38"/>
<circle cx="216" cy="363" r="36" fill="none" stroke="#6dc8fa" stroke-width="3" opacity="0.7"/>
<rect x="198" y="341" width="36" height="44" rx="10" fill="#8bd8ff" stroke="#b5e7ff"/>
<circle cx="216" cy="356" r="4" fill="#174265"/>
<text x="216" y="498" font-size="22" fill="#d4e9ff" font-weight="500" text-anchor="middle">指定 UUID 的 iBeacon</text>
<text x="216" y="537" font-size="21" fill="#9fbcd7" font-weight="400" text-anchor="middle">進入／離開指定範圍</text>
<path d="M391 374 H431" fill="none" stroke="#557393" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="448" y="180" width="360" height="396" rx="24" fill="#12243a" stroke="#355c82"/>
<text x="480" y="230" font-size="25" fill="#eaf0ff" font-weight="600" text-anchor="start">02  判定有效事件</text>
<text x="628" y="300" font-size="28" fill="#a3dafe" font-weight="600" text-anchor="middle">Core Location</text>
<text x="628" y="332" font-size="21" fill="#a9bdd4" font-weight="400" text-anchor="middle">區域監控與狀態變化</text>
<path d="M628 350 V379" fill="none" stroke="#557393" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="480" y="396" width="296" height="68" rx="14" fill="#24465a" stroke="#437b8b"/>
<text x="628" y="438" font-size="24" fill="#aaf0df" font-weight="600" text-anchor="middle">防重複 × 冷卻規則</text>
<text x="628" y="522" font-size="22" fill="#b6cfdd" font-weight="500" text-anchor="middle">符合規則才建立紀錄</text>
<path d="M824 374 H864" fill="none" stroke="#557393" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="880" y="180" width="344" height="396" rx="24" fill="#13263c" stroke="#355c82"/>
<text x="912" y="230" font-size="25" fill="#eaf0ff" font-weight="600" text-anchor="start">03  保存在本機</text>
<rect x="912" y="270" width="280" height="110" rx="15" fill="#1d3a51" stroke="#365f79"/>
<text x="936" y="309" font-size="25" fill="#d4e9ff" font-weight="600" text-anchor="start">SwiftData 紀錄</text>
<text x="936" y="348" font-size="21" fill="#a9bdd4" font-weight="400" text-anchor="start">查看 · 篩選 · 清理</text>
<rect x="912" y="402" width="280" height="110" rx="15" fill="#1d3a51" stroke="#365f79"/>
<text x="936" y="442" font-size="25" fill="#d4e9ff" font-weight="600" text-anchor="start">本機通知</text>
<text x="936" y="480" font-size="21" fill="#a9bdd4" font-weight="400" text-anchor="start">依通知設定與權限</text>
<text x="1052" y="550" font-size="20" fill="#b6cfdd" font-weight="500" text-anchor="middle">無需帳號與後端服務</text>
<path d="M56 608 H1224" fill="none" stroke="#2d445e" stroke-width="2" />
<text x="56" y="646" font-size="19" fill="#9cb1c9" font-weight="400" text-anchor="start">事件接收受 iOS 排程、權限與環境影響。</text>
<text x="56" y="685" font-size="17" fill="#819bb6" font-weight="400" text-anchor="start">功能概念圖，非 App 介面截圖</text>
<text x="1224" y="680" font-size="20" fill="#c0d1e6" font-weight="500" text-anchor="end">SwiftUI · SwiftData · Core Location</text>
</g></svg>